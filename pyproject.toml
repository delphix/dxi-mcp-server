[project]
name = "dct-mcp-server"
version = "2026.0.2.0-preview"
description = "Delphix DCT API MCP Server - A Model Context Protocol server for the Delphix Data Control Tower API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.2",
    "httpx>=0.24.0",
    "pyyaml",
    "requests",
    "urllib3>=2.7.0"
]

[project.scripts]
dct-mcp-server = "dct_mcp_server.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dct_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Pinned to ruff 0.15.x in ci.yml and .pre-commit-config.yaml so format/lint
# results are identical locally and in CI.
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# __init__.py modules are re-export hubs: the "unused" imports are intentional
# public API surface, not dead code.
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
