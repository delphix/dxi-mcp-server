[project]
name = "dct-mcp-server"
version = "2026.0.3.0-preview"
description = "Delphix DCT API MCP Server - A Model Context Protocol server for the Delphix Data Control Tower API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.2,<4",
    # CVE-2026-59951: mcp < 1.30.0 unbounded session accumulation in StreamableHTTP
    # transport enables resource exhaustion. Pin to >=1.30.0 (first patched version).
    "mcp>=1.30.0,<2",
    "cryptography>=50.0.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.24.0",
    "pyyaml",
    "requests",
    # CVE-2026-97689: urllib3 < 2.8.0 buffers unbounded chunk-size lines in
    # HTTPResponse.stream()/read_chunked(). Pin to >=2.8.0 (fixed version).
    "urllib3>=2.8.0",
    # CVE-2026-7246: click<=8.3.2 has a command-injection flaw in click.edit().
    # click is pulled in transitively via mcp -> uvicorn. Pin here to guarantee
    # the patched version (>=8.3.3) is installed regardless of what uvicorn resolves.
    "click>=8.3.3",
    # CVE-2026-102266, CVE-2026-102268, CVE-2026-102273: PyJWT has three vulnerabilities
    # in versions < 2.14.0: empty HMAC key acceptance (CVE-2026-102266), asymmetric-PEM
    # detection bypass (CVE-2026-102268), and public JWK container accepted as HMAC
    # secret (CVE-2026-102273). Pulled in transitively via mcp[crypto]. Pin to >=2.14.0.
    "pyjwt>=2.14.0",
    # CVE-2026-63374, CVE-2026-63349, CVE-2026-64847: anyio < 4.14.2 has three vulnerabilities:
    # IDNA 2003 hostname validation bypass enabling MITM (CVE-2026-63374, Critical 9.1),
    # extra_groups privilege-drop bypass in open_process() (CVE-2026-63349, Medium 5.7),
    # and process-pool stderr pipe never drained causing DoS (CVE-2026-64847, Medium 5.5).
    # Pulled in transitively via httpx and mcp. Pin to >=4.14.2.
    "anyio>=4.14.2",
    # WS-2026-0133: certifi < 2026.10.19 ships a stale CA bundle missing revocations.
    # Pulled in transitively via httpx. Pin to >=2026.10.19.
    "certifi>=2026.10.19",
]

[project.scripts]
dct-mcp-server = "dct_mcp_server.main:main"
dct-mcp-test = "dct_mcp_server.testing.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "respx>=0.23.1",
    "pytest-json-report>=1.5.0",
    "starlette>=0.30",
    "uvicorn>=0.27",
    "click>=8.3.3",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-json-report>=1.5.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dct_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--tb=short"
markers = [
    "real_dct: tests that require a live DCT instance (DCT_BASE_URL + DCT_API_KEY env vars)",
    "llm_driven: Layer 5 tests driven by the Claude Code CLI (also require a live DCT and the `claude` CLI)",
    "scenario: Claude-driven persona scenario suite vs real DCT (select via SCENARIO_PERSONAS env)",
]

[tool.coverage.run]
source = ["src/dct_mcp_server"]
omit = [
    "*/toolsgenerator/*",
    "*/tools/core/tool_factory.py",
    "*/tools/*_endpoints_tool.py",
]

[tool.ruff]
# Pinned to ruff 0.15.x in ci.yml and .pre-commit-config.yaml so format/lint
# results are identical locally and in CI.
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# __init__.py modules are re-export hubs: the "unused" imports are intentional
# public API surface, not dead code.
"__init__.py" = ["F401"]
