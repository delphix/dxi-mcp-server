[project]
name = "dct-mcp-server"
version = "2026.0.1.0-preview"
description = "Delphix DCT API MCP Server - A Model Context Protocol server for the Delphix Data Control Tower API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.2",
    "httpx>=0.24.0",
    "pyyaml",
    "requests",
    "urllib3>=2.6.3"
]

[project.scripts]
dct-mcp-server = "dct_mcp_server.main:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "starlette>=0.30",
    "uvicorn>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dct_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
