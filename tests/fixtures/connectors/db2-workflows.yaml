# ════════════════════════════════════════════════════════════════════════════
# DB2 — Connector (Toolkit) workflows via DCT MCP Server
#
# Scoped to the Connector/Toolkit category for now (list → upload → delete).
# Toolkit operations are engine-level, so they use the already-registered engine
# and do NOT require a DB2 host. Add Engine/Environment/dSource/VDB categories
# later, same structure as mysql-workflows.yaml.
# ════════════════════════════════════════════════════════════════════════════

categories:

  # ── 3. Connector workflows (Toolkit) ────────────────────────────────────────
  - name: Connector
    scenarios:
      - id: test_toolkit_list
        kind: readonly
        description: List all toolkits/connectors
        prompt: Show me all installed toolkits/connectors with their names and versions.
        expect_tool: toolkit_tool
        expect_action: search
        timeout: 180

      # Toolkit upload is NOT possible through the MCP server: DCT's
      # /toolkits/upload requires multipart/form-data (binary file), but the
      # generic JSON MCP client sends application/json → HTTP 415. Documented as
      # N/A (matches DLPXECO-13687 "Not possible / Fail (Expected behaviour)").
      # Verdict for `na`: PASS-equivalent if the LLM correctly attempts the tool.
      - id: test_toolkit_upload
        kind: na
        description: Upload the DB2 connector toolkit (not possible via MCP — multipart upload)
        prompt: >
          Upload the IBM DB2 connector toolkit from file 'db2db 2.json' using
          toolkit_tool upload_toolkit (confirmed=true).
        expect_tool: toolkit_tool
        expect_action: upload_toolkit
        timeout: 300

      # Delete requires a DB2 toolkit to be present. Since it cannot be uploaded
      # via MCP, this is only meaningful if DB2 was installed out-of-band. Marked
      # na unless a DB2 toolkit exists on the engine.
      - id: test_toolkit_delete
        kind: na
        description: Delete the DB2 connector toolkit (requires DB2 toolkit pre-installed)
        prompt: >
          Delete the IBM DB2 toolkit/connector (toolkit_tool delete_toolkit,
          confirmed=true). If no DB2 toolkit exists, report that it is not present.
        expect_tool: toolkit_tool
        expect_action: delete_toolkit
        timeout: 300
