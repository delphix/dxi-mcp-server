# Connector schema — committed to repo, NO secrets.
#
# Documents the required and optional fields for each connector type's
# dSource link and VDB provision steps. Claude uses these as hints when
# driving the MCP server; the test framework uses them to build prompts.
#
# Secrets (passwords, hostnames) live in:
#   Local dev : tests/fixtures/connectors/.secrets.yaml  (gitignored)
#   CI        : DCT_CONNECTOR_<TYPE>_<FIELD> env vars (GitHub Secrets)
#
# To add a new connector:
#   1. Add a section here with its required_link_fields and provision_fields.
#   2. Add the connector's secrets to .secrets.yaml (copy from .secrets.yaml.example).
#   3. Set CONNECTOR_TYPE=<type> when running tests.

# Engine registration fields (required before any connector workflow).
# Secrets live in .secrets.yaml under the 'engine' key.
# CI env vars: DCT_ENGINE_HOSTNAME, DCT_ENGINE_NAME, DCT_ENGINE_USERNAME,
#              DCT_ENGINE_PASSWORD, DCT_ENGINE_INSECURE_SSL
engine:
  fields:
    - name: hostname
      description: "Delphix Engine IP or FQDN"
      example: dlpx-engine.example.com
    - name: name
      description: "Display name for the engine in DCT"
      example: My Engine
    - name: username
      description: "Virtualization domain admin username"
      default: admin
    - name: password
      description: "Virtualization domain admin password"
    - name: insecure_ssl
      description: "Skip TLS cert validation (set true for lab/dev)"
      default: true

connectors:

  # ── MySQL via Delphix AppData/Plugin ──────────────────────────────────────
  mysql:
    display_name: "MySQL (AppData / Plugin)"
    connector_search_keyword: plugin
    dsource_link_action: dsource_link_appdata
    provision_action: provision_by_snapshot
    # Toolkit to upload in the setup step if the connector isn't already installed.
    # Override with DCT_CONNECTOR_MYSQL_TOOLKIT_FILE or a toolkit_file key in .secrets.yaml.
    toolkit_file: sc_mysqlinux_2026.2.1.json

    # ── Runtime config-generation rules (no hardcoded values) ────────────────
    # MySQLConfigAllocator in connector_fixtures.py reads these to generate
    # unique serverId / port / mountPath / name combinations on the fly.
    # Nothing here is a credential or environment-specific value.
    config_generation:
      server_id_range: [200, 800]        # inclusive; must be unique across all objects
      dsource_server_id_step: 100        # 201, 301, 401 … (start=201)
      vdb_server_id_offset: 50           # VDB serverId = dSource serverId + 50  (251, 351…)
      port_prefix: 2000                  # port = prefix + serverId  (201→2201, 251→2251)
      dsource_mount_template: "/mnt/link/staging{port}"
      vdb_mount_template: "/mnt/link/vdb{port}"
      dsource_name_template: "mysql_test{suffix}"   # suffix="" for first, "1","2"… after
      vdb_name_templates:
        - "TEST{n}"                      # TEST1, TEST2, TEST3 …
        - "{rand6}"                      # 6-char alphanum fallback when n>999
    environment_fields:
      - name: toolkit_path
        description: "Path on the host where the Delphix toolkit will be installed"
        default: /tmp
    source_config_fields:
      - name: name
        description: "Source config name"
        default: mysql_test
      - name: source_config_host
        description: "Which environment to create the source config on (source or target)"
        default: target
      - name: data_dir
        description: "MySQL data directory path on the host"
        default: /var/lib/mysql
      - name: port
        description: "MySQL port on the host"
        default: 3306
      - name: base_dir
        description: "MySQL installation base directory on the host (where /bin/mysql lives)"
        default: /usr
    link_type: AppDataStaged               # Staging Push ingestion
    required_link_fields:
      - name: mountPath
        description: "Unique NFS mount directory on the staging host (pattern: /mnt/link/<stagingPort>)"
        default: /mnt/link/2150
      - name: stagingBasedir
        description: "MySQL installation base directory on staging host (where /bin/mysql lives)"
        default: /usr
      - name: stagingPort
        description: "Port for the staging MySQL instance — must differ from source (3306)"
        default: 2150
      - name: sourceip
        description: "Source MySQL hostname (auto-populated from source_host)"
        source: source_host
      - name: sourceUser
        description: "DB user for the staging database"
        source: link_user
      - name: sourcePass
        description: "DB password for the staging database"
        source: link_password
      - name: serverId
        description: "MySQL server-id for staging DB — must be unique on the network"
        default: 150
      - name: stagingInitPassword
        description: "Host user password used while initializing the staging DB"
        source: link_password
    provision_fields:
      - name: vdbUser
        description: "DB user for the VDB MySQL instance"
        source: link_user
      - name: vdbPass
        description: "DB password for the VDB MySQL instance"
        source: link_password
      - name: baseDir
        description: "MySQL installation base directory on VDB host (where /bin/mysql lives)"
        default: /usr
      - name: port
        description: "Port for the VDB MySQL instance — must differ from source (3306) and staging (2150)"
        default: 2151
      - name: serverId
        description: "MySQL server-id for the VDB — must be unique on the network"
        default: 151
      - name: mPath
        description: "Unique NFS mount directory for the VDB (pattern: /mnt/provision/<port>)"
        default: /mnt/provision/2151

    # ── Workflow verification matrix ─────────────────────────────────────────
    # Mirrors DLPXECO-13687: validate virtualization workflows via the DCT MCP
    # server. Each row checks that an LLM, given the plain-English `prompt`,
    # drives the server to call `expect_tool`/`expect_action` and (for mutations)
    # that the operation completes — confirmed by an INDEPENDENT read
    # (`verify_prompt` + verify_contains / verify_absent).
    #
    # Fields:
    #   section        — report grouping (Engine / Environment / Toolkit / dSource / VDB / Monitoring)
    #   id             — testcase name
    #   kind           — readonly | mutation | expected_error | na | destructive
    #                      readonly       : list/show; assert tool+action only
    #                      mutation       : assert tool+action AND verify completion
    #                      expected_error : op should be rejected; PASS = error relayed (EXPECTED-ERROR)
    #                      na             : not applicable to this connector (status N/A)
    #                      destructive    : harms shared infra; SKIPPED unless CONNECTOR_DESTRUCTIVE=1
    #   expect_tool/expect_action — the MCP tool + action the LLM must select
    #   verify_prompt / verify_contains / verify_absent — independent completion check
    #
    # Placeholders (resolved at runtime from schema + .secrets.yaml):
    #   {display_name} {connector} {engine_name} {engine_hostname}
    #   {dsource_name} {vdb_name} {source_host} {target_host}
    #   {env_user} {env_password} {link_user} {link_password}
    #   {source_config_name} {dsource_link_action} {provision_action}
    #
    # Rows run top-to-bottom and CHAIN (provision needs a linked dSource); the
    # `section` tag drives report grouping, independent of run order. Edit freely
    # — no code change needed.
    workflows:

      # ══ Setup / bootstrap ════════════════════════════════════════════════════
      # Runs FIRST so every dependent test has its prerequisite. Each step is
      # IDEMPOTENT — it ensures the object exists, creating it only if missing
      # (the pre-prompt enforces search-before-create). A setup step PASSES when
      # the object is present afterwards, whether it was created now or already
      # existed — so the verdict is completion-based, not action-based.
      - {section: Setup, id: setup_add_engine, kind: setup,
         description: "Ensure the Delphix engine is registered in DCT",
         prompt: "Ensure a Delphix engine with hostname '{engine_hostname}' is registered. First list engines; if it already exists, confirm and stop. Otherwise register it with username '{engine_username}', password '{engine_password}', name '{engine_name}', using insecure SSL.",
         expect_tool: engine_tool, expect_action: register,
         verify_prompt: "List all registered engines and their hostnames.",
         verify_contains: "{engine_hostname}", timeout: 400}

      - {section: Setup, id: setup_upload_toolkit, kind: setup,
         description: "Ensure the connector toolkit is installed (upload if missing)",
         prompt: "Ensure the {display_name} connector/toolkit is installed. First list toolkits; if a matching plugin is already installed, confirm and stop. Otherwise upload the toolkit from file '{toolkit_file}'.",
         expect_tool: toolkit_tool, expect_action: upload_toolkit,
         verify_prompt: "List all installed toolkits and their names.",
         timeout: 400}

      # Capability test for "add environment": delete-then-recreate the target so
      # create_environment genuinely fires (idempotent skip can't prove the add
      # path). DESTRUCTIVE — clears all datasets on the target env first; the rest
      # of Setup then rebuilds source config / dSource / VDB on the fresh env.
      - {section: Environment, id: test_create_environment, kind: mutation,
         description: "Add environment — verified by delete-then-recreate of the target host",
         prompt: "Verify environment creation end-to-end by recreating the target environment for host '{target_host}'. Do these in order, polling each job to COMPLETED:
           1. Delete every VDB on that environment (data_tool delete_vdb, confirmed=True; use attempt_cleanup=True if a normal delete is blocked).
           2. Delete every dSource on that environment (data_tool delete_dsource, confirmed=True).
           3. Delete every AppData source config on that environment (environment_source_tool delete_source, confirmed=True).
           4. Delete the environment itself for host '{target_host}' (environment_source_tool delete_environment, confirmed=True).
           5. Add host '{target_host}' back as a Unix environment using SSH user '{env_user}' and password '{env_password}' (environment_source_tool create_environment); wait for the create job and repository discovery to COMPLETE.
           This MUST call create_environment in step 5.",
         expect_tool: environment_source_tool, expect_action: create_environment,
         verify_prompt: "List all environments and show their hostnames and status.",
         verify_contains: "{target_host}", timeout: 1800}

      - {section: Setup, id: setup_create_source_config, kind: setup,
         description: "Ensure the STAGED source config used for linking exists",
         prompt: "Ensure an AppData source config named '{source_config_name}' exists on the environment for host '{target_host}' (environment user '{env_user}'). First list sources; if it already exists, confirm it and stop. Otherwise create it with data_tool create_appdata_source and you MUST pass type='STAGED' (NOT the default DIRECT) — the {display_name} plugin uses staged linking and rejects DIRECT source configs. Find the plugin repository_id on that environment automatically.",
         expect_tool: data_tool, expect_action: create_appdata_source,
         verify_prompt: "Use environment_source_tool action=search_sources to list all source CONFIGS (NOT dSources) and show their names.",
         verify_contains: "{source_config_name}", timeout: 500}

      - {section: Setup, id: setup_link_dsource, kind: setup,
         description: "Ensure the dSource is linked (Staging Push)",
         prompt: "Ensure a {display_name} dSource named '{dsource_name}' is linked from the environment on host '{target_host}', using source config '{source_config_name}' and data_tool action={dsource_link_action}. If a dSource with that name already exists, confirm it; otherwise link it.",
         expect_tool: data_tool, expect_action: "{dsource_link_action}",
         verify_prompt: "Search for all dSources and show each one's name and status.",
         verify_contains: "{dsource_name}", timeout: 1200}

      - {section: Setup, id: setup_provision_vdb, kind: setup,
         description: "Ensure a VDB is provisioned from the dSource",
         prompt: "Ensure a {display_name} VDB named '{vdb_name}' exists, provisioned from the latest snapshot of dSource '{dsource_name}' onto host '{target_host}' using data_tool action={provision_action}. If it already exists, confirm it; otherwise provision it.",
         expect_tool: data_tool, expect_action: "{provision_action}",
         verify_prompt: "Search for all VDBs and show each one's name and status.",
         verify_contains: "{vdb_name}", timeout: 1200}

      # ── Engine ──────────────────────────────────────────────────────────────
      - {section: Engine, id: test_list_engines, kind: readonly,
         description: "List all registered engines",
         prompt: "List all registered Delphix engines with their name and status.",
         expect_tool: engine_tool, expect_action: search, timeout: 180}

      # ── Environment ─────────────────────────────────────────────────────────
      - {section: Environment, id: test_list_environment, kind: readonly,
         description: "List environments",
         prompt: "List all environments and show hostname and status.",
         expect_tool: environment_source_tool, expect_action: search_environments, timeout: 180}

      - {section: Environment, id: test_enable_environment, kind: mutation,
         description: "Enable environment",
         prompt: "Enable the environment for host '{target_host}'.",
         expect_tool: environment_source_tool, expect_action: enable_environment,
         verify_prompt: "List environments and show host '{target_host}' status.",
         verify_contains: "{target_host}", timeout: 300}

      - {section: Environment, id: test_disable_environment, kind: mutation,
         description: "Disable then it will be re-enabled by enable step",
         prompt: "Disable the environment for host '{target_host}', then immediately enable it again. Confirm it ends ENABLED.",
         expect_tool: environment_source_tool, expect_action: disable_environment,
         verify_prompt: "List environments and show host '{target_host}' status.",
         verify_contains: "{target_host}", timeout: 400}

      - {section: Environment, id: test_refresh_environment, kind: mutation,
         description: "Refresh environment",
         prompt: "Refresh the environment for host '{target_host}'.",
         expect_tool: environment_source_tool, expect_action: refresh_environment,
         verify_prompt: "List environments and show host '{target_host}' status.",
         verify_contains: "{target_host}", timeout: 600}

      - {section: Environment, id: test_update_environment, kind: mutation,
         description: "Update environment (toolkit path)",
         prompt: "Change the toolkit directory of the environment on host '{target_host}' to '/tmp'.",
         expect_tool: environment_source_tool, expect_action: update_environment,
         timeout: 300}

      - {section: Environment, id: test_list_users_environment, kind: readonly,
         description: "List environment users",
         prompt: "Show the users configured on the environment for host '{target_host}'.",
         expect_tool: environment_source_tool, expect_action: get_environment, timeout: 180}

      - {section: Environment, id: test_add_users_environment, kind: mutation,
         description: "Add an environment user",
         prompt: "Add OS user '{link_user}' (password '{link_password}') to the environment on host '{target_host}'. If already present, confirm it.",
         expect_tool: environment_source_tool, expect_action: add_environment_users,
         verify_prompt: "Show the users on the environment for host '{target_host}'.",
         verify_contains: "{link_user}", timeout: 300}

      - {section: Environment, id: test_add_source_config, kind: mutation,
         description: "Add a source config (STAGED)",
         prompt: "Create an AppData source config named '{source_config_name}-wf' on the environment for host '{target_host}', environment user '{env_user}'. You MUST pass type='STAGED' (NOT DIRECT) — the {display_name} plugin rejects DIRECT source configs. If it already exists, confirm it.",
         expect_tool: data_tool, expect_action: create_appdata_source,
         verify_prompt: "Use environment_source_tool action=search_sources to list all source CONFIGS (NOT dSources) and show their names.",
         verify_contains: "{source_config_name}-wf", timeout: 400}

      - {section: Environment, id: test_update_source_config, kind: mutation,
         description: "Update source config",
         prompt: "Update the source config named '{source_config_name}-wf' — change its name to '{source_config_name}-wf2'.",
         expect_tool: data_tool, expect_action: update_appdata_source,
         verify_prompt: "Use environment_source_tool action=search_sources to list all source CONFIGS (NOT dSources) and show their names.",
         verify_contains: "{source_config_name}-wf2", timeout: 400}

      - {section: Environment, id: test_delete_source_config, kind: mutation,
         description: "Delete source config",
         prompt: "Delete the source config named '{source_config_name}-wf2'.",
         expect_tool: environment_source_tool, expect_action: delete_source,
         verify_prompt: "Use environment_source_tool action=search_sources to list all source CONFIGS (NOT dSources) and show their names.",
         verify_absent: "{source_config_name}-wf2", timeout: 400}

      # ── Toolkit (Connector) ─────────────────────────────────────────────────
      - {section: Toolkit, id: test_toolkit_list, kind: readonly,
         description: "List all toolkits/connectors",
         prompt: "Show me all installed toolkits/connectors.",
         expect_tool: toolkit_tool, expect_action: search, timeout: 180}

      - {section: Toolkit, id: test_toolkit_upload, kind: na,
         description: "Upload a connector (not supported via MCP)",
         prompt: "Upload a new connector toolkit from a local file.",
         expect_tool: toolkit_tool, expect_action: upload_toolkit, timeout: 120}

      - {section: Toolkit, id: test_toolkit_delete, kind: expected_error,
         description: "Delete the in-use connector (should be rejected for dependencies)",
         prompt: "Delete the {display_name} toolkit/connector.",
         expect_tool: toolkit_tool, expect_action: delete_toolkit, timeout: 200}

      # ── dSource ─────────────────────────────────────────────────────────────
      - {section: dSource, id: test_list_dSource, kind: readonly,
         description: "List all dSources",
         prompt: "Show me all dSources with their name and status.",
         expect_tool: data_tool, expect_action: search_dsources, timeout: 180}

      - {section: dSource, id: test_list_snapshots, kind: readonly,
         description: "List snapshots of a dSource",
         prompt: "Show all snapshots of the dSource named '{dsource_name}'.",
         expect_tool: data_tool, expect_action: list_dsource_snapshots, timeout: 300}

      - {section: dSource, id: test_disable_dSource, kind: mutation,
         description: "Disable then re-enable the dSource",
         prompt: "Disable the dSource named '{dsource_name}', then enable it again. Confirm it ends ENABLED.",
         expect_tool: data_tool, expect_action: disable_dsource,
         verify_prompt: "Search for all dSources and show '{dsource_name}' status.",
         verify_contains: "{dsource_name}", timeout: 500}

      - {section: dSource, id: test_enable_dSource, kind: mutation,
         description: "Enable the dSource",
         prompt: "Enable the dSource named '{dsource_name}'.",
         expect_tool: data_tool, expect_action: enable_dsource,
         verify_prompt: "Search for all dSources and show '{dsource_name}' status.",
         verify_contains: "{dsource_name}", timeout: 500}

      - {section: dSource, id: test_sync_dSource, kind: mutation,
         description: "Take a snapshot of the dSource",
         prompt: "Take a new snapshot of the dSource named '{dsource_name}'.",
         expect_tool: data_tool, expect_action: dsource_create_snapshot,
         verify_prompt: "List the snapshots of dSource '{dsource_name}' and show how many exist.",
         verify_contains: "{dsource_name}", timeout: 600}

      - {section: dSource, id: test_sync_dSource_with_params, kind: mutation,
         description: "Snapshot the dSource with resync=true",
         prompt: "Take a snapshot of the dSource named '{dsource_name}' with sync parameter resync set to true.",
         expect_tool: data_tool, expect_action: dsource_create_snapshot,
         verify_prompt: "List the snapshots of dSource '{dsource_name}'.",
         verify_contains: "{dsource_name}", timeout: 600}

      # ── VDB ─────────────────────────────────────────────────────────────────
      - {section: VDB, id: test_list_vdbs, kind: readonly,
         description: "List all VDBs",
         prompt: "Show me all VDBs with their name and status.",
         expect_tool: data_tool, expect_action: search_vdbs, timeout: 180}

      - {section: VDB, id: test_refresh_vdb, kind: mutation,
         description: "Refresh VDB to the latest snapshot",
         prompt: "Refresh the VDB named '{vdb_name}' with the latest snapshot of dSource '{dsource_name}'.",
         expect_tool: data_tool, expect_action: refresh_vdb_by_snapshot,
         verify_prompt: "Search for all VDBs and show '{vdb_name}' status.",
         verify_contains: "{vdb_name}", timeout: 900}

      - {section: VDB, id: test_rollback_vdb, kind: mutation,
         description: "Rewind/rollback VDB to its earliest snapshot",
         prompt: "Rewind the VDB named '{vdb_name}' to its earliest snapshot.",
         expect_tool: data_tool, expect_action: rollback_vdb_by_snapshot,
         verify_prompt: "Search for all VDBs and show '{vdb_name}' status.",
         verify_contains: "{vdb_name}", timeout: 900}

      - {section: VDB, id: test_disable_vdb, kind: mutation,
         description: "Disable the VDB",
         prompt: "Disable the VDB named '{vdb_name}'.",
         expect_tool: data_tool, expect_action: disable_vdb,
         verify_prompt: "Search for all VDBs and show '{vdb_name}' status.",
         verify_contains: "{vdb_name}", timeout: 500}

      - {section: VDB, id: test_enable_vdb, kind: mutation,
         description: "Enable the VDB",
         prompt: "Enable the VDB named '{vdb_name}'.",
         expect_tool: data_tool, expect_action: enable_vdb,
         verify_prompt: "Search for all VDBs and show '{vdb_name}' status.",
         verify_contains: "{vdb_name}", timeout: 500}

      - {section: VDB, id: test_stop_vdb, kind: mutation,
         description: "Stop the VDB",
         prompt: "Stop the VDB named '{vdb_name}'.",
         expect_tool: data_tool, expect_action: stop_vdb,
         verify_prompt: "Search for all VDBs and show '{vdb_name}' status.",
         verify_contains: "{vdb_name}", timeout: 500}

      - {section: VDB, id: test_start_vdb, kind: mutation,
         description: "Start the VDB",
         prompt: "Start the VDB named '{vdb_name}'.",
         expect_tool: data_tool, expect_action: start_vdb,
         verify_prompt: "Search for all VDBs and show '{vdb_name}' status.",
         verify_contains: "{vdb_name}", timeout: 500}

      - {section: VDB, id: test_snapsync_vdb, kind: mutation,
         description: "Take a snapshot of the VDB",
         prompt: "Take a new snapshot of the VDB named '{vdb_name}'.",
         expect_tool: data_tool, expect_action: snapshot_vdb,
         verify_prompt: "List the snapshots of VDB '{vdb_name}'.",
         verify_contains: "{vdb_name}", timeout: 600}

      - {section: VDB, id: test_undo_refresh_vdb, kind: mutation,
         description: "Undo the last refresh/rewind on the VDB",
         prompt: "Perform an undo-refresh on the VDB named '{vdb_name}'.",
         expect_tool: data_tool, expect_action: undo_vdb_refresh,
         verify_prompt: "Search for all VDBs and show '{vdb_name}' status.",
         verify_contains: "{vdb_name}", timeout: 700}

      - {section: VDB, id: test_v2p, kind: na,
         description: "Virtual-to-physical export (not supported by this plugin)",
         prompt: "Export the latest snapshot of VDB '{vdb_name}' to /mnt/local as a physical dataset.",
         expect_tool: data_tool, expect_action: export_vdb_by_snapshot, timeout: 400}

      - {section: VDB, id: test_delete_vdb, kind: mutation,
         description: "Delete the VDB",
         prompt: "Delete the VDB named '{vdb_name}'.",
         expect_tool: data_tool, expect_action: delete_vdb,
         verify_prompt: "Search for all VDBs and list their names.",
         verify_absent: "{vdb_name}", timeout: 600}

      - {section: dSource, id: test_delete_dSource, kind: mutation,
         description: "Delete the dSource (after VDB removed)",
         prompt: "Delete the dSource named '{dsource_name}'.",
         expect_tool: data_tool, expect_action: delete_dsource,
         verify_prompt: "Search for all dSources and list their names.",
         verify_absent: "{dsource_name}", timeout: 600}

      # ── Monitoring (Jobs, Faults, Alerts) ────────────────────────────────────
      - {section: Monitoring, id: test_list_faults, kind: readonly,
         description: "List virtualization faults",
         prompt: "List any virtualization faults.",
         expect_tool: reporting_tool, expect_action: get_virtualization_faults_history, timeout: 200}

      - {section: Monitoring, id: test_list_alerts, kind: readonly,
         description: "List outstanding alerts",
         prompt: "List any outstanding virtualization alerts.",
         expect_tool: reporting_tool, expect_action: get_virtualization_alerts_history, timeout: 200}

      - {section: Monitoring, id: test_list_jobs, kind: readonly,
         description: "List jobs (e.g. failed today)",
         prompt: "List all jobs that failed recently.",
         expect_tool: job_tool, expect_action: search, timeout: 200}

      - {section: Monitoring, id: test_list_job_by_id, kind: readonly,
         description: "Get detail of a specific job",
         prompt: "Show the details of the most recent job, including its status and steps.",
         expect_tool: job_tool, expect_action: search, timeout: 200}

      # ── Engine teardown (shared-infra; opt-in) ───────────────────────────────
      - {section: Engine, id: test_deregister_engine, kind: destructive,
         description: "Deregister the test engine (shared-infra; opt-in)",
         prompt: "Remove/deregister the engine named '{engine_name}'.",
         expect_tool: engine_tool, expect_action: unregister,
         verify_prompt: "List all registered engines and their names.",
         verify_absent: "{engine_name}", timeout: 300}

  # ── IBM DB2 via AppData plugin ────────────────────────────────────────────
  db2:
    display_name: "IBM DB2 (AppData / Plugin)"
    connector_search_keyword: db2
    dsource_link_action: dsource_link_appdata
    provision_action: provision_by_snapshot
    required_link_fields:
      - name: mountPath
        description: "NFS mount directory on staging host"
        default: /mnt/provision
      - name: stagingBasedir
        description: "DB2 installation base directory on staging host"
        example: /opt/ibm/db2/V11.5
      - name: database
        description: "DB2 database name to link"
        example: MYDB
      - name: port
        description: "DB2 source port"
        default: 50000
      - name: sourceUser
        description: "DB2 instance user"
        source: link_user
      - name: sourcePass
        description: "DB2 instance password"
        source: link_password
    provision_fields:
      - name: vdbName
        description: "Name for the VDB database"
        example: MYVDB
      - name: mountPath
        description: "NFS mount path for the VDB"
        default: /mnt/provision
      - name: port
        description: "DB2 port for the VDB"
        example: 50001

  # ── PostgreSQL via AppData plugin ─────────────────────────────────────────
  postgresql:
    display_name: "PostgreSQL (AppData / Plugin)"
    connector_search_keyword: postgresql
    dsource_link_action: dsource_link_appdata
    provision_action: provision_by_snapshot
    required_link_fields:
      - name: mountPath
        description: "NFS mount directory on staging host"
        default: /mnt/provision
      - name: stagingBasedir
        description: "PostgreSQL installation base directory"
        example: /usr/pgsql-14
      - name: database
        description: "PostgreSQL database name to link"
        example: mydb
      - name: port
        description: "PostgreSQL source port"
        default: 5432
      - name: sourceUser
        description: "PostgreSQL user"
        source: link_user
      - name: sourcePass
        description: "PostgreSQL password"
        source: link_password
    provision_fields:
      - name: mountPath
        description: "NFS mount path for the VDB"
        default: /mnt/provision
      - name: port
        description: "PostgreSQL port for the VDB"
        example: 5433

  # ── Oracle ────────────────────────────────────────────────────────────────
  oracle:
    display_name: "Oracle"
    connector_search_keyword: oracle
    dsource_link_action: dsource_link_oracle
    provision_action: provision_by_snapshot
    required_link_fields:
      - name: db_credentials_username
        description: "Oracle DB user (SYSDBA or link user)"
        source: link_user
      - name: db_credentials_password
        description: "Oracle DB password"
        source: link_password
      - name: oracle_jdbc_connection_string
        description: "JDBC connection string e.g. //host:1521/SID"
        example: "//source-host:1521/ORCL"
      - name: mount_path
        description: "NFS mount path on target host"
        default: /mnt/provision
    provision_fields:
      - name: mount_path
        description: "NFS mount path for the VDB"
        default: /mnt/provision

  # ── MS SQL Server ─────────────────────────────────────────────────────────
  mssql:
    display_name: "MS SQL Server"
    connector_search_keyword: mssql
    dsource_link_action: dsource_link_mssql
    provision_action: provision_by_snapshot
    required_link_fields:
      - name: db_credentials_username
        description: "SQL Server login user"
        source: link_user
      - name: db_credentials_password
        description: "SQL Server login password"
        source: link_password
    provision_fields: []

  # ── SAP ASE (Sybase) ──────────────────────────────────────────────────────
  ase:
    display_name: "SAP ASE (Sybase)"
    connector_search_keyword: ase
    dsource_link_action: dsource_link_ase
    provision_action: provision_by_snapshot
    required_link_fields:
      - name: db_credentials_username
        description: "ASE DB user"
        source: link_user
      - name: db_credentials_password
        description: "ASE DB password"
        source: link_password
    provision_fields: []
